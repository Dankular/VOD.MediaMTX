services:
  mediamtx:
    image: bluenviron/mediamtx:1.21.3
    restart: unless-stopped
    ports:
    - 8554:8554/tcp
    - 1935:1935/tcp
    environment:
      MTX_API: 'true'
      MTX_RTSPTRANSPORTS: tcp
      MTX_AUTHINTERNALUSERS: '[{"user": "publisher", "pass": "${PUBLISH_PASSWORD:-}",
        "permissions": [{"action": "publish", "path": ""}]}, {"user": "recorder",
        "pass": "${RECORDER_PASSWORD:-}", "permissions": [{"action": "read", "path":
        ""}, {"action": "api"}]}]'
  minio:
    image: minio/minio:latest
    command:
    - server
    - /data
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-vodadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-}
    volumes:
    - objects:/data
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://127.0.0.1:9000/minio/health/live
      interval: 10s
      timeout: 5s
      retries: 15
  bucket-init:
    image: minio/mc:latest
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-vodadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
    - /bin/sh
    - -c
    - mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
      && mc mb --ignore-existing local/vod
  vod-recorder:
    build:
      context: .
      dockerfile: Dockerfile.recorder
    restart: unless-stopped
    environment:
      MEDIAMTX_API_URL: http://recorder:${RECORDER_PASSWORD:-}@mediamtx:9997
      MEDIAMTX_RTSP_URL: rtsp://recorder:${RECORDER_PASSWORD:-}@mediamtx:8554
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-vodadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET_NAME: vod
      S3_REGION: us-east-1
      MAX_CONCURRENT_RECORDINGS: '3'
      SEGMENT_DURATION: '60'
    volumes:
    - recordings:/recordings
    - logs:/logs
    depends_on:
      mediamtx:
        condition: service_started
      bucket-init:
        condition: service_completed_successfully
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    environment:
      VOD_ADMIN_PASSWORD: ${VOD_ADMIN_PASSWORD:-}
    volumes:
    - recordings:/usr/share/nginx/html/recordings:ro
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://127.0.0.1/healthz
      interval: 15s
      timeout: 5s
      retries: 10
volumes:
  objects: {}
  recordings: {}
  logs: {}
