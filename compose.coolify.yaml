services:
  mediamtx:
    image: bluenviron/mediamtx:1.21.3
    restart: unless-stopped
    ports:
    - 8554:8554/tcp
    - 1935:1935/tcp
    environment:
      MTX_API: 'true'
      MTX_RTSPTRANSPORTS: tcp
      MTX_AUTHINTERNALUSERS: '[{"user": "publisher", "pass": "${PUBLISH_PASSWORD:-}",
        "permissions": [{"action": "publish", "path": ""}]}, {"user": "recorder",
        "pass": "${RECORDER_PASSWORD:-}", "permissions": [{"action": "read", "path":
        ""}, {"action": "api"}]}]'
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '2'
  vod-recorder:
    build:
      context: .
      dockerfile: Dockerfile.recorder
    restart: unless-stopped
    environment:
      MEDIAMTX_API_URL: http://recorder:${RECORDER_PASSWORD:-}@mediamtx:9997
      MEDIAMTX_RTSP_URL: rtsp://recorder:${RECORDER_PASSWORD:-}@mediamtx:8554
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-vodadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_BUCKET_NAME: apps
      S3_REGION: eu-west-3
      MAX_CONCURRENT_RECORDINGS: '1'
      SEGMENT_DURATION: '60'
      UPLOAD_WORKERS: '1'
    volumes:
    - recordings:/recordings
    - logs:/logs
    depends_on:
      mediamtx:
        condition: service_started
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '2'
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    environment:
      VOD_ADMIN_PASSWORD: ${VOD_ADMIN_PASSWORD:-}
    volumes:
    - recordings:/usr/share/nginx/html/recordings:ro
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://127.0.0.1/healthz
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '2'
volumes:
  recordings: {}
  logs: {}
